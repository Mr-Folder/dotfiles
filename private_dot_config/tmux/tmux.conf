######################################
############## GENERAL ###############
######################################
set -sg escape-time 10
set -g mouse on
set -g default-shell /usr/bin/zsh
set -g history-limit 150000
set -g repeat-time 1000
set -g renumber-windows on
set -g focus-events on
set-window-option -g mode-keys vi

# Truecolor: tmux-256color inside, RGB passthrough for kitty outside
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Let programs (nvim, claude) name windows / the terminal tab
set -g set-titles on
set -g set-titles-string "#S:#W #{session_alerts}"

# Bell = "an agent wants attention": flag the window, alert the terminal
set -g bell-action any
set -g visual-bell off

# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind C-l send-keys 'C-l'

######################################
############### STYLE ################
######################################
set -g display-panes-active-colour red
set -g display-panes-colour blue

# set pane borders to dark gray and active pane border to lime blue
set -g pane-border-style fg=colour238,bg=default
set -g pane-active-border-style fg=colour45,bg=default

# Set window status styles
set -g window-status-style fg=colour238,bg=default # Dark gray for inactive window titles
set -g window-status-current-style fg=colour45,bg=default # Lime blue for the active window title

# Set status bar to dark gray background with lime blue text
set -g status-style fg=colour45,bg=colour238

# Message / command prompt style
set -g message-style fg=colour45,bg=colour238
set -g message-command-style fg=colour45,bg=colour238

######################################
############### PANES ################
######################################
# Zoom first pane
bind-key -n M-t if-shell '[ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]' \
  'resize-pane -Z; select-pane -t 0; resize-pane -Z' \
  'select-pane -t 0; resize-pane -Z'
# Zoom second pane
bind-key -n M-y if-shell '[ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]' \
  'resize-pane -Z; select-pane -t 1; resize-pane -Z' \
  'select-pane -t 1; resize-pane -Z'
# Zoom third pane
bind-key -n M-u if-shell '[ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]' \
  'resize-pane -Z; select-pane -t 2; resize-pane -Z' \
  'select-pane -t 2; resize-pane -Z'

######################################
############## WINDOWS ###############
######################################
bind-key -n M-0 select-window -t 0
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

######################################
############## PLUGINS ###############
######################################
# TMUX Yank, for copying to system clipboard
set -g @plugin 'tmux-plugins/tmux-yank'
# TMUX Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
# TMUX Configuration that should be the default
set -g @plugin 'tmux-plugins/tmux-sensible'
# TMUX status bar
set -g @plugin 'niksingh710/minimal-tmux-status'
# TMUX - Nvim navigator
set -g @plugin 'christoomey/vim-tmux-navigator'
# TMUX Fast copy
set -g @plugin 'abhinav/tmux-fastcopy'
set-option -g set-clipboard on
set-option -g @fastcopy-action 'tmux load-buffer -w -'

##### CLAUDE POPUP #####
bind-key -n M-o run-shell '~/.config/tmux/scripts/claude-popup.sh'

##### HERDR AGENTS POPUP #####
bind-key -n M-i display-popup -E -w 64 -h 50% -b rounded -S fg=colour240 -T ' agents ' '~/.config/tmux/scripts/herdr-panel.sh'

##### FLOAX #####
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind '-n M-p'
set -g @floax-width '80%'
set -g @floax-height '75%'
set -g @floax-border-color 'colour240'
set -g @floax-text-color 'default'
set -g @floax-change-path 'false'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
