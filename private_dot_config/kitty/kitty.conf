# vim:fileencoding=utf-8
# Full annotated reference: https://sw.kovidgoyal.net/kitty/conf/

font_family      FiraCode Nerd Font

# Bell: silent, but flash the taskbar so tmux bell alerts surface
enable_audio_bell no
window_alert_on_bell yes

# Desktop notification when a long command finishes in an unfocused window
notify_on_cmd_finish unfocused

# BEGIN_KITTY_THEME
# duckbones
include current-theme.conf
# END_KITTY_THEME
