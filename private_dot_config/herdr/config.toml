# tmux-flavoured keybindings.
# Outer tmux prefix is ctrl+space, so ctrl+b is free for herdr.

[keys]
prefix = "ctrl+b"

# vim-style pane navigation, same keys as tmux (vim-tmux-navigator).
# tmux passes these through to herdr panes (see tmux.conf).
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"

# tmux-style prefix bindings
new_tab          = "prefix+c"
next_tab         = "prefix+n"
previous_tab     = "prefix+p"
split_vertical   = "prefix+v"
split_horizontal = "prefix+minus"
close_pane       = "prefix+x"
zoom             = "prefix+z"
copy_mode        = "prefix+["
detach           = "prefix+d"
