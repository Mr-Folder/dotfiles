# /home/lpeltier/.config/tmuxinator/transcity.yaml
name: transcity
root: ~/Workspace/transcity

windows:
  # Window 0 - VPN
  - vpn:
      root: ~
  # Window 1 - Shell
  - shell:
  # Window 2 - nvim
  - nvim:
      layout: main-horizontal
      panes:
        - nvim:
            - nvim
  # Window 3 - k9s
  - k9s: cd ~ && k9s
  # Window 4 - nvim
  - alpha: cd alpha && nvim
