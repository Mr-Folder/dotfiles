# #4293f5
format = """
$directory\
[](fg:#146A8E bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#212736 bg:#1d2230)\
[ ](fg:#1d2230)\
$character"""


right_format = """
$kubernetes\
$time
"""

[directory]
style = "fg:#e3e5e5 bg:#146a8e"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $branch ](fg:#769ff0 bg:#394260)]($style)'
disabled = false

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[kubernetes]
symbol  = "󱃾 "
format  = '  [⛵$context](bold bright-blue)'
disabled = false

# DR clusters in yellow (matched first: "transcity-aks-dr" also contains "transcity-aks")
[[kubernetes.contexts]]
context_pattern = ".*dr.*"
style = "bold yellow"

# Main prod cluster in red
[[kubernetes.contexts]]
context_pattern = "transcity-aks"
style = "bold red"

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled     = false
time_format  = "%R"                       # Hour:Minute format
format       = '[ -   $time ](dimmed white bg:none)'
